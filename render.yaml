# Render Blueprint Configuration for WhatIf City Frontend (Static Site)
services:
  - type: web
    name: whatif-city-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.2.0
      - key: VITE_API_BASE_URL
        sync: false
